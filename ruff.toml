# Lint and format rules for scripts/ (the API has its own in api/pyproject.toml).
line-length = 100
target-version = "py312"

[lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PIE",
    "ASYNC", "S", "BLE", "ERA", "PTH", "RUF",
]
# Scripts print to the terminal, and run fixed commands and URLs.
ignore = ["E501", "S310", "S603", "S607"]
