[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<1",
    "openai>=3.37,<4",
    "httpx2>=2.16,<3",
    "pyjwt[crypto]>=2.15,<3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
httpx = "^0.28"
ruff = "^0.17"
mypy = "^2.4"
poethepoet = "^0.49"

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --port 8000"
migrate = "alembic upgrade head"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy ."
test = "pytest"
check = ["format-check", "lint", "typecheck", "test"]
fix = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PIE", "PT",
    "ASYNC", "S", "BLE", "T20", "ERA", "PTH", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"migrations/**" = ["ERA001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
